<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Sora:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <meta
      name="theme-color"
      content="#080b18"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#080b18"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/android-chrome-512x512.png"
    />
    <link rel="icon" type="image/png" href="assets/icons/favicon-16x16.png" />
    <link rel="manifest" href="assets/icons/site.webmanifest" />
    <title>Personal Savings Tracker</title>
  </head>
  <body>
    <header>
      <img src="assets/images/psa-logo-main.png" alt="" />
      <h3 class="greeting">Welcome, Odey</h3>
      <span><i class="fas fa-bars"></i></span>
    </header>

    <!-- home page -->
    <main>
      <!-- main hero -->
      <section class="savings-hero">
        <div class="hero-left">
          <h4>Total Savings</h4>
          <h2 class="amount">₦10,600.00</h2>
          <p>Last updated 12:43pm, on 2026-09-06</p>
        </div>

        <!-- savings progress chart -->
        <div class="hero-right">
          <canvas class="chart" id="progress-chart"> </canvas>
        </div>
      </section>
      <div class="main-cta">
        <button type="button" class="add-button" id="add-btn">
          <i class="fas fa-plus"></i>
          Add Savings
        </button>
      </div>

      <!-- savings trend chart -->
      <section class="trend-container">
        <h4>Savings trend</h4>
        <canvas class="savings-trend" id="trend-chart"> </canvas>
      </section>

      <!-- recent transactions -->
      <section class="recent-trnxs-section">
        <h2>Recent Transactions</h2>
        <div class="recent">
          <h4>₦20,000</h4>
          <p>Withdrawal</p>
          <small>2026-09-10, 03:04 PM</small>
        </div>
        <div class="recent">
          <h4>₦10,000</h4>
          <p>Deposit</p>
          <small>2026-07-12, 17:01 PM</small>
        </div>
        <div class="recent">
          <h4>₦5,000</h4>
          <p>Deposit</p>
          <small>2026-08-29, 12:56 PM</small>
        </div>
        <button class="recentTrnxBtn" id="recent">See full report</button>
      </section>

      <!-- bottom navigation -->
      <section class="bottom-navigation">
        <i class="fas fa-home"></i>
        <i class="fas fa-plus"></i>
        <i class="fas fa-chart-line"></i>
        <i class="fas fa-wallet"></i>
      </section>

      <!-- add savings page / modal -->
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js" type="text/javascript"></script>
    <script src="js/chart.js"></script>
    <script src="manifest.json"></script>
  </body>
</html>
